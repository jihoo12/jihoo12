name: README SVG

on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'

permissions:
  contents: write

concurrency:
  group: readme-svg
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: synthwave banner
        uses: jihoo12/github-readme-svg@v0.1
        with:
          style: synthwave
          name: Hi, I'm Jihoo
          lines: |
            Welcome to my GitHub!
          out: assets/readme-svg/synthwave.svg

      - name: Contribution galaxy
        uses: jihoo12/github-readme-svg@v0.1
        with:
          style: contrib-galaxy
          user: ${{ github.repository_owner }}
          palette: ice
          out: assets/readme-svg/contrib-galaxy.svg

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme-svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update README SVGs"
            git pull --rebase
            git push
          fi
