name: signal

on:
  schedule:
    - cron: "17 0 * * *"   # daily, 09:17 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/generate.py]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render SVGs
        env:
          # optional PAT (read:user) to include private contributions
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate.py --user ${{ github.repository_owner }} --out assets
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || git commit -m "chore: refresh profile svgs"
          git push
