
name: Monkey Civilization

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate Monkey Civilization
        uses: jihoo12/monkeys@main
        with:
          github_token: ${{ secrets.MONKEY }}
          username: jihoo12
          output: assets/monkey-civilization.svg
          json_output: assets/monkey-civilization.json

      - name: Commit generated civilization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/monkey-civilization.svg assets/monkey-civilization.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: update monkey civilization"
            git push
          fi
