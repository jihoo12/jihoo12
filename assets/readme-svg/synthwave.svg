<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Hi, I&#x27;m Jihoo">
  <title>Hi, I&#x27;m Jihoo</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0221"/><stop offset=".7" stop-color="#2b0a4a"/><stop offset="1" stop-color="#5a0f62"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe86b"/><stop offset=".5" stop-color="#ff7a59"/><stop offset="1" stop-color="#ff2a8a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0433"/><stop offset="1" stop-color="#05010d"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".35" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="sunMask">
      <rect width="900" height="300" fill="#fff"/>
      <rect x="0" y="138.0" width="900" height="1.5" fill="#000"/>
      <rect x="0" y="151.4" width="900" height="2.8" fill="#000"/>
      <rect x="0" y="165.6" width="900" height="4.1" fill="#000"/>
      <rect x="0" y="180.6" width="900" height="5.4" fill="#000"/>
      <rect x="0" y="196.4" width="900" height="6.7" fill="#000"/>
      <rect x="0" y="213.0" width="900" height="8.0" fill="#000"/>
    </mask>
    <mask id="floorFade"><rect y="200" width="900" height="100" fill="url(#fade)"/></mask>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b1"/>
      <feGaussianBlur stdDeviation="9" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sunGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="frame"><rect width="900" height="300" rx="18"/></clipPath>
    <clipPath id="aboveHorizon"><rect width="900" height="200"/></clipPath>
  </defs>
  <style>
    .star  { fill: #fff; animation: twinkle ease-in-out infinite; }
    .grid  { stroke: #ff3df2; stroke-width: 1.4; opacity: .85; }
    .row   { animation: approach 4.0s cubic-bezier(.55,0,1,.45) infinite; }
    .sun   { animation: pulse 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .draw  { font: 900 72px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: none; stroke: #4df3ff; stroke-width: 2;
             stroke-dasharray: 420; animation: draw 9s ease-in-out infinite; }
    .fill  { font: 900 72px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #e9fdff; animation: fillIn 9s ease-in-out infinite; }
    .neon  { animation: flicker 9s linear infinite; }
    .sub   { font: 600 18px ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; fill: #ffe3fa; letter-spacing: 4px; paint-order: stroke; stroke: #1a0433; stroke-width: 5px; stroke-linejoin: round; animation: fadeUp 9s ease-out infinite; }
    .scan  { animation: scan 7s linear infinite; }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    @keyframes approach { from { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } to { transform: translateY(100px); opacity: 1; } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    @keyframes draw { 0% { stroke-dashoffset: 420; } 30% { stroke-dashoffset: 0; } 90% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes fillIn { 0%,28% { opacity: 0; } 38%,90% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes flicker { 0%,40%,44%,46%,70%,72%,100% { opacity: 1; } 42%,45%,71% { opacity: .35; } }
    @keyframes fadeUp { 0%,35% { opacity: 0; transform: translateY(8px); } 45%,90% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(300px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .draw { stroke-dashoffset: 0; } }
  </style>

