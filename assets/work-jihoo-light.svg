<svg xmlns="http://www.w3.org/2000/svg" width="880" height="124" viewBox="0 0 880 124" role="img" aria-label="jihoo — An easy programming language with three profiles."><title>jihoo — An easy programming language with three profiles.</title>
<style>
  .mono { font-family: 'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace; }
  .sans { font-family: 'Inter','Helvetica Neue',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; }
  .tick { font-size: 8.5px; fill: #8a8780; letter-spacing: .12em; }
  .label { font-size: 9.5px; fill: #8a8780; letter-spacing: .16em; }
  .val { font-size: 15px; fill: #16171a; font-weight: 500; }
  .unit { font-size: 9.5px; fill: #8a8780; }
  .ln { stroke-linecap: round; stroke-linejoin: round;
         animation: draw 1.6s cubic-bezier(.6,0,.2,1) backwards; }
  .fade { animation: fade .9s ease-out backwards; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes draw { from { stroke-dasharray: 1; stroke-dashoffset: 1; }
                     to { stroke-dasharray: 1; stroke-dashoffset: 0; } }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  .grow { transform-box: fill-box; transform-origin: 50% 100%;
           animation: grow .7s cubic-bezier(.3,1.4,.5,1) backwards; }
  .type { animation: type .01s steps(1) backwards; }
  .blink { animation: blink 1.05s steps(1) infinite; }
  @keyframes grow { from { transform: scaleY(0); } }
  @keyframes type { from { opacity: 0; } }
  @keyframes blink { 50% { opacity: 0; } }
  
  @media (prefers-reduced-motion: reduce) {
    .ln, .fade, .pulse, .grow, .type, .blink { animation: none; }
  }
</style>
